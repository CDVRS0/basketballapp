<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CD4Q Runs: App Demo V5</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFFFFF;--surf:#F2F5FC;--ink:#0A0A0A;--mute:#55607A;--blue:#1646D8;--on:#fff;--edge:#D3DBEE;--ok:#14803F;--bad:#C4321F;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Barlow,system-ui,sans-serif}
h1,h2,h3,.big{font-family:'Barlow Condensed',Impact,sans-serif;margin:0;line-height:1;font-weight:800}
button{font:inherit;color:inherit;cursor:pointer}:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;max-width:640px;margin:0 auto}
.logo{font:800 28px 'Barlow Condensed',Impact,sans-serif}.logo span{color:var(--blue)}
.seg{display:flex;border:1.5px solid var(--edge);border-radius:99px;overflow:hidden}.seg button{background:none;border:0;padding:6px 14px;font-weight:600}.seg .on{background:var(--ink);color:var(--bg)}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 100px}
h2{font-size:34px;margin:20px 0 8px}
.card{background:var(--surf);border:1.5px solid var(--edge);border-radius:12px;padding:16px;margin:12px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.mute{color:var(--mute);font-size:14px}.big{font-size:30px}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:600;border:1.5px solid var(--edge)}
.pill.ok{color:var(--ok);border-color:var(--ok)}.pill.bad{color:var(--bad);border-color:var(--bad)}.pill.b{color:var(--blue);border-color:var(--blue)}
.bar{height:8px;background:var(--edge);border-radius:9px;margin:10px 0 6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue)}.bar.full i{background:var(--bad)}
.left{font:700 15px 'Barlow Condensed',Impact,sans-serif;letter-spacing:.04em}
.btn{background:var(--blue);color:var(--on);border:0;border-radius:10px;padding:10px 16px;font-weight:700;min-height:44px}
.btn.ghost{background:none;color:var(--ink);border:1.5px solid var(--edge)}.btn:disabled{opacity:.45;cursor:default}
.banner{border-left:5px solid var(--bad);background:var(--surf);border-radius:10px;padding:12px 14px;margin:12px 0}
.locked{border-style:dashed;text-align:center;color:var(--mute)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1.5px solid var(--edge);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;max-width:120px;background:none;border:0;padding:12px 2px;font-weight:600;color:var(--mute)}nav .on{color:var(--blue);box-shadow:inset 0 3px 0 var(--blue)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat b{font:800 38px 'Barlow Condensed',Impact,sans-serif;display:block}
.tbl{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:15px}td,th{text-align:left;padding:8px 6px;border-bottom:1px solid var(--edge);white-space:nowrap}
input,select{font:inherit;background:var(--bg);color:var(--ink);border:1.5px solid var(--edge);border-radius:8px;padding:9px;width:100%;margin:4px 0 10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px;z-index:9}.modal .card{max-width:380px;width:100%;background:var(--bg)}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:10;max-width:90%}
.plan.cur{border-color:var(--blue);border-width:2.5px}.demo{border-style:dashed}.bar.live i{background:var(--ok);transition:width 1s linear}nav button{font-size:13px}
.tk{background:var(--surf);border:2px solid var(--blue);border-radius:12px;padding:16px;margin:12px 0}.tk .o{color:var(--blue)}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .25s ease-out}@keyframes up{from{transform:translate(-50%,12px);opacity:0}}}
</style>
</head>
<body>
<header id="hd"><div class="logo">CD4Q<span>.</span>Runs</div><div class="seg" role="group" aria-label="Demo view"><button id="rp" onclick="setRole('player')">Player</button><button id="ra" onclick="setRole('admin')">Admin</button></div><button class="btn ghost" style="min-height:36px;padding:4px 12px" onclick="S.user=null;S.auth='login';render()">Log out</button></header>
<div class="wrap" id="app"></div><nav id="nav"></nav><div id="layer"></div>
<script>
const H=3600e3,D=24*H,T0=Date.now();
const PL={cd4q_2:{n:'CD4Q 2',p:'£15 / month',c:2,len:30,d:'2 credits per billing period.'},cd4q_4:{n:'CD4Q 4',p:'£30 / 2 months',c:4,len:60,d:'4 credits per billing period.'}};
let S={role:'player',tab:'home',prod:'payg',status:'none',credits:0,ps:0,pe:0,booked:{},waiting:{},offers:{},win:5,cut:12,soon:false,
notes:['Only 2 spaces left for this weekend\'s CD4Q.'],
sessions:[[30,10],[366,11],[702,12],[1038,3],[1374,1]].map((a,i)=>({id:i,h:a[0],cap:12,taken:a[1],wlM:i===2?1:0,wlP:i===2?1:0,venue:'Webber',addr:'Webber Street, London SE1'}))};
const mem=()=>S.prod!=='payg'&&(S.status==='active'||S.status==='ending');
const start=s=>S.liveS&&s.id===0?S.liveS:T0+(S.soon&&s.id===0?10:s.h)*H,hrs=s=>(start(s)-Date.now())/H;
const fd=t=>new Date(t).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
const ft=t=>new Date(t).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})+', '+new Date(t).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
const $=i=>document.getElementById(i);
const toast=m=>{const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),3000)};
const note=m=>S.notes.unshift(m);
const modal=h=>$('layer').innerHTML='<div class="modal" onclick="if(event.target===this)closeM()"><div class="card">'+h+'</div></div>';
const closeM=()=>$('layer').innerHTML='';
const setRole=r=>{S.role=r;S.tab=r==='admin'?'overview':'home';render()},tab=t=>{S.tab=t;render()};
const checkout=(t,a,ok)=>modal(`<h3 class="big">${t}</h3><p class="mute">Stripe Checkout (demo). The real app opens Stripe's secure page.</p><p class="big">${a}</p><button class="btn" style="background:var(--ink);width:100%;margin-bottom:6px" onclick="closeM();${ok}">Pay with Apple Pay or Google Pay</button><p class="mute" style="margin:0 0 10px">Shown when your device supports it.</p><div class="row"><button class="btn ghost" onclick="closeM()">Cancel</button><button class="btn" onclick="closeM();${ok}">Pay by card</button></div>`);
function book(id){const s=S.sessions[id];if(!S.user.prof.ep){toast('Add an emergency contact in your profile first');return tab('profile')}
 if(s.taken>=s.cap){S.waiting[id]=1;note('You joined the waitlist.');return render()}
 if(mem()&&S.status==='active'&&S.credits>0&&start(s)<=S.pe){S.credits--;s.taken++;S.booked[id]='credit';note('You\'re booked for CD4Q.');toast('Booked. 1 credit used');delete S.waiting[id];delete S.offers[id];render()}
 else checkout('Book session','£7',`payBook(${id})`)}
function payBook(id){S.sessions[id].taken++;S.booked[id]='paid';delete S.waiting[id];delete S.offers[id];note('You\'re booked for CD4Q.');toast('Booked');render()}
function askCancel(id){const s=S.sessions[id],late=hrs(s)<=S.cut,cr=S.booked[id]==='credit';
 modal(`<h3 class="big">${late?'Late cancellation':'Cancel booking?'}</h3><p>${late?(cr?`Your membership credit will not be returned because this cancellation is within ${S.cut} hours of the session.`:`You're cancelling within the ${S.cut}-hour cancellation window. Your payment will not be refunded.`):(cr?'Your credit will be returned.':'Your £7 will be refunded.')}</p><div class="row"><button class="btn ghost" onclick="closeM()">Keep booking</button><button class="btn" onclick="doCancel(${id})">Cancel booking</button></div>`)}
function doCancel(id){closeM();const s=S.sessions[id],late=hrs(s)<=S.cut,cr=S.booked[id]==='credit';s.taken--;delete S.booked[id];
 if(cr&&!late&&S.status!=='none')S.credits++;
 toast(cr?(late?'Cancelled. Credit not returned':'Cancelled. Credit returned'):(late?'Cancelled. No refund':'Refund initiated. Time to appear depends on your payment provider.'));render()}
function setPlan(p){S.prod=p;S.status='active';S.ps=Date.now();S.pe=Date.now()+PL[p].len*D;S.credits=PL[p].c;note('Membership active. Credits added.');toast('Membership active');render()}
function endMem(msg){const n=Object.keys(S.booked).filter(id=>start(S.sessions[id])>Date.now()+S.win*D);
 n.forEach(id=>{S.sessions[id].taken--;delete S.booked[id]});S.prod='payg';S.status='none';S.credits=0;
 note(msg+(n.length?` ${n.length} future booking${n.length>1?'s':''} outside the pay as you go window cancelled.`:' Your bookings inside the pay as you go window stay.'));toast('Back on pay as you go');render()}
function failRenewal(){if(!mem())return toast('Join a plan first');S.status='past_due';note('Membership payment failed. We\'ll retry in 3 days.');render()}
function retryOk(){if(S.status!=='past_due')return toast('No failed payment');setPlan(S.prod)}
function simOpen(){const id=Object.keys(S.waiting)[0];if(id===undefined)return toast('Join a waitlist first');const s=S.sessions[id];s.taken=s.cap-1;S.offers[id]=1;note('A space has opened for CD4Q. You have 2 hours to claim it.');toast('A space opened');render()}
function adjust(n){modal(`<h3 class="big">Adjust credits: ${n}</h3><label class="mute" for="rs">Reason (required)</label><input id="rs"><div class="row"><button class="btn ghost" onclick="closeM()">Cancel</button><button class="btn" onclick="if(!$('rs').value.trim())return toast('A reason is required');closeM();toast('Adjustment logged with reason')">Apply +1</button></div>`)}
function addSess(){const d=$('nd').value;if(!d)return toast('Pick a date');S.sessions.push({id:S.sessions.length,h:(new Date(d)-Date.now())/H,cap:+$('nc').value||12,taken:0,wlM:0,wlP:0,venue:$('nv').value||'TBC',addr:$('na').value||'TBC'});toast('Session published');render()}
const lab=s=>{const l=s.cap-s.taken;return l<=0?'FULL':l===1?'1 SPACE LEFT':l+' SPACES LEFT'};
function sCard(s){const t=start(s),id=s.id,mine=S.booked[id];if(s.cx)return `<div class="card locked"><div class="big">${ft(t)}</div><span class="pill bad">Run cancelled</span><p class="mute" style="margin:6px 0 0">Credits and refunds are returned automatically.</p></div>`;
 if(!mem()&&hrs(s)>S.win*24)return `<div class="card locked"><div class="big">${ft(t)}</div><p class="mute" style="margin:6px 0 0">Members see sessions further ahead. Opens to pay as you go ${S.win} days before.</p></div>`;
 const full=s.taken>=s.cap;const lv=Date.now()>=t&&Date.now()<=t+2*H;let a;
 if(mine)a=`<button class="btn ghost" onclick="askCancel(${id})">Cancel</button>`;
 else if(S.offers[id])a=`<button class="btn" onclick="book(${id})">Claim place</button>`;
 else if(S.waiting[id])a=`<button class="btn ghost" onclick="delete S.waiting[${id}];render()">Leave waitlist</button>`;
 else if(full)a=`<button class="btn ghost" onclick="book(${id})">Join waitlist</button>`;
 else if(S.status==='active'&&mem()){a=start(s)>S.pe||S.credits<=0?`<button class="btn" onclick="book(${id})">Book · £7${S.credits>0?'':' (no credits left)'}</button>`:`<button class="btn" onclick="book(${id})">Book · 1 credit</button>`}
 else a=`<button class="btn" onclick="book(${id})">Book · £7</button>`;
 const pos=mem()?s.wlM+1:s.wlM+s.wlP+1;
 return `<div class="card"><div class="row"><div><div class="big">${ft(t)}</div><div class="mute">${s.venue} · ${s.addr}</div><details style="margin-top:6px"><summary style="cursor:pointer;color:var(--blue);font-size:14px">Map and directions</summary>${mapBox(s.addr)}</details>${mine&&mine!=='wait'?`<details style="margin-top:6px"><summary style="cursor:pointer;color:var(--blue);font-size:14px">Who's on this run (${s.taken})</summary><div style="margin:6px 0">${NM.slice(0,Math.max(0,s.taken-1)).map((n,i)=>`<button class="pill" style="margin:2px;cursor:pointer;background:none;color:var(--ink)" onclick="viewP(${i})">${av(PR[i],20)} ${n}</button>`).join('')}<button class="pill" style="margin:2px;cursor:pointer;background:none;color:var(--ink)" onclick="viewP('me')">${av({ic:S.user.prof.ic,n:S.user.name},20)} You</button></div></details>`:''}${mine==='credit'?`<div class="mute">${hrs(s)>S.cut?'Credit held. Used for good after '+ft(start(s)-S.cut*H):'Credit used'}</div>`:''}</div>${mine?'<span class="pill ok">Booked</span>':S.offers[id]?'<span class="pill b">Space open</span>':S.waiting[id]?`<span class="pill b">Waitlist #${pos}</span>`:''}</div>${lv?liveBar(t,t+2*H):`<div class="bar ${full?'full':''}"><i style="width:${s.taken/s.cap*100}%"></i></div>`}<div class="row"><span class="left">${lv?'LIVE NOW':`${s.taken}/${s.cap} · ${lab(s)}`}</span>${lv?'':a}</div></div>`}
function home(){let h='';const b=Object.keys(S.booked).map(i=>S.sessions[i]).sort((a,c)=>start(a)-start(c));
 h+=S.msgs.map(m=>`<div class="banner" style="border-left-color:var(--blue)"><b>${m.t}</b><br>${m.b}</div>`).join('')+`<h2>Your dashboard</h2>`;
 if(S.status==='past_due')h+=`<div class="banner"><b>Membership payment failed</b><br>We'll retry your payment in 3 days. New member bookings are unavailable until payment is successful. Your existing bookings remain confirmed.<br><button class="btn" style="margin-top:8px" onclick="tab('plan')">Fix payment</button></div>`;
 h+=mem()||S.status==='past_due'?`<div class="card"><div class="row"><div class="big">${PL[S.prod].n}</div><span class="pill ${S.status==='past_due'?'bad':'ok'}">${S.status==='active'?'ACTIVE':S.status==='ending'?'ENDS '+fd(S.pe):'PAST DUE'}</span></div><p class="mute" style="margin:6px 0">${PL[S.prod].p}</p>${S.status==='past_due'?'<b>No new credits until paid</b>':cbox()}<p class="mute" style="margin:6px 0 0">Cycle: ${fd(S.ps)} to ${fd(S.pe)} · ${S.status==='ending'?'No further payments':'Next payment: '+fd(S.pe)}</p></div>`:`<div class="card"><div class="row"><div class="big">Pay as you go</div><span class="pill">FREE TIER</span></div><p class="mute" style="margin:6px 0 10px">£7 per session. Sessions open ${S.win} days ahead.</p><button class="btn" onclick="tab('plan')">See memberships</button></div>`;
 h+=`<h2>Upcoming bookings</h2>`+(b.length?b.map(s=>`<div class="card"><div class="row"><div><b>${ft(start(s))}</b><div class="mute">${s.venue} · <a href="${mp(s.addr,S.mapPref)}" target="_blank" rel="noopener" style="color:var(--blue)">Directions</a> · ${hrs(s)>S.cut?'Free cancellation':'Late cancellation window'}</div></div><span class="pill ok">Booked</span></div></div>`).join(''):`<div class="card mute">Nothing booked yet. <a href="#" onclick="tab('sessions');return false" style="color:var(--blue)">Browse sessions</a></div>`);
 h+=takeBox();return h+`<h2>Settings</h2><div class="card"><div class="mute">Maps app for directions</div><div class="seg" style="width:max-content;margin:6px 0">${['google','apple'].map(k=>`<button class="${S.mapPref===k?'on':''}" onclick="S.mapPref='${k}';render()">${k==='google'?'Google Maps':'Apple Maps'}</button>`).join('')}</div><p class="mute" style="margin:0">Signed in as ${S.user.email}</p></div><p class="mute">Questions? <a href="mailto:hello@yourdomain.com" style="color:var(--blue)">Email us</a></p>`}
function plan(){let h=`<h2>Membership</h2>`;
 if(S.status==='past_due')h+=`<div class="banner"><b>Payment failed.</b> Update your card to restore member benefits.<br><button class="btn" style="margin-top:8px" onclick="retryOk()">Update card (demo)</button></div>`;
 h+=`<div class="card ${S.prod==='payg'?'plan cur':''}"><div class="row"><h3 class="big">Pay as you go</h3><b>£7 / session</b></div><p class="mute">One session. No commitment. Sessions open ${S.win} days ahead.</p></div>`;
 h+=Object.keys(PL).map(k=>{const p=PL[k];return `<div class="card plan ${S.prod===k&&S.status!=='none'?'cur':''}"><div class="row"><h3 class="big">${p.n}</h3><b>${p.p}</b></div><p class="mute">${p.d} Credits last for your billing period and expire when it ends. Priority access, priority waitlist, earlier access to future sessions, 15% off your Takeover 3x3 entry.</p>${S.prod===k&&S.status!=='none'?'<span class="pill b">Your plan</span>':`<button class="btn" onclick="checkout('Join ${p.n}','${p.p}',&quot;setPlan('${k}')&quot;)">Join</button>`}</div>`}).join('');
 if(S.status==='active')h+=`<button class="btn ghost" onclick="S.status='ending';note('Membership cancelled. Benefits stay until ${fd(S.pe)}.');toast('Benefits stay until period end');render()">Cancel membership</button>`;
 h+=`<p class="mute">CDVRS Sports Pass (perks, no credits) may come later.</p>`;
 h+=`<div class="card demo"><b>Demo controls</b><p class="mute">Prototype only.</p><div class="row" style="flex-wrap:wrap;justify-content:flex-start"><button class="btn ghost" onclick="failRenewal()">Renewal fails</button><button class="btn ghost" onclick="retryOk()">Day 3 retry works</button><button class="btn ghost" onclick="S.status==='none'?toast('No membership'):endMem('Payment could not be collected.')">Day 3 retry fails</button><button class="btn ghost" onclick="S.status==='none'?toast('No membership'):endMem('Your membership period ended.')">Period ends</button><button class="btn ghost" onclick="simOpen()">Space opens</button><button class="btn ghost" onclick="S.soon=!S.soon;toast(S.soon?'Next session in 10 hours':'Reset');render()">Next session in 10h</button><button class="btn ghost" onclick="S.liveS=Date.now()-40*60e3;tab('sessions')">Run goes live</button><button class="btn ghost" onclick="S.tl=Date.now()-90*60e3;tab('events')">Takeover goes live</button></div></div>`;return h}
function alerts(){return `<h2>Notifications</h2>`+S.notes.map(n=>`<div class="card">${n}</div>`).join('')}
function admin(){const s=S.sessions[0];let h=`<h2>Overview</h2><div class="grid"><div class="card stat"><b>48</b><span class="mute">Registered</span></div><div class="card stat"><b>${mem()?19:18}</b><span class="mute">Active members</span></div><div class="card stat"><b>${S.status==='past_due'?2:1}</b><span class="mute">Payment pending</span></div><div class="card stat"><b>21</b><span class="mute">PAYG users</span></div><div class="card stat"><b>${s.cap-s.taken}</b><span class="mute">Spaces, next session</span></div><div class="card stat"><b>${s.wlM+s.wlP}</b><span class="mute">Waitlist</span></div></div><h2>Sessions</h2>`;
 h+=S.sessions.map(x=>`<div class="card row"><div><b>${ft(start(x))}</b><div class="mute">${x.taken}/${x.cap} booked · ${x.wlM+x.wlP} waiting</div></div>${x.cx?'<span class="pill bad">Cancelled</span>':`<span class="pill ${x.taken>=x.cap?'bad':'ok'}">${lab(x)}</span> <button class="btn ghost" style="min-height:34px;padding:4px 10px" onclick="askRun(${x.id})">Cancel run</button>`}</div>`).join('');
 h+=`<div class="card"><h3 class="big">Add a session</h3><label class="mute" for="nd">Date and time</label><input id="nd" type="datetime-local"><label class="mute" for="nv">Venue name</label><input id="nv"><label class="mute" for="na">Address (used for the Google Maps link)</label><input id="na"><label class="mute" for="nc">Capacity</label><input id="nc" type="number" value="12"><button class="btn" onclick="addSess()">Publish session</button></div>`;
 h+=attAdmin()+msgAdmin()+tourAdmin();h+=`<h2>Members</h2><div class="card tbl"><table><tr><th>Name</th><th>Plan</th><th>Status</th><th>Credits</th><th></th></tr>${[['Marcus T.','CD4Q 2','ok','Active',1],['Jaden O.','CD4Q 4','ok','Active',3],['Kofi A.','CD4Q 2','bad','Past due',0],['Dan R.','PAYG','','Free tier',0]].map(m=>`<tr><td>${m[0]}</td><td>${m[1]}</td><td><span class="pill ${m[2]}">${m[3]}</span></td><td>${m[4]}</td><td><button class="btn ghost" style="min-height:34px;padding:4px 10px" onclick="adjust('${m[0]}')">Adjust</button></td></tr>`).join('')}</table></div>`;
 h+=`<h2>Settings</h2><div class="card"><label class="mute" for="w">PAYG booking window (days)</label><input id="w" type="number" value="${S.win}" onchange="S.win=+this.value||5;toast('Saved')"><label class="mute" for="c">Cancellation cutoff (hours)</label><input id="c" type="number" value="${S.cut}" onchange="S.cut=+this.value||12;toast('Saved')"><p class="mute">Payment retry: 3 days · Waitlist claim window: 2 hours</p></div>`;return h}
function render(){const y=scrollY;$('hd').style.display=S.user?'flex':'none';if(!S.user){$('nav').innerHTML='';$('app').innerHTML=authView();return}$('rp').className=S.role==='player'?'on':'';$('ra').className=S.role==='admin'?'on':'';
 const P={home,sessions:()=>`<h2>Sessions</h2>`+(S.status==='active'?`<div class="card">${cbox()}</div>`:'')+S.sessions.map(sCard).join(''),events,plan,alerts,profile,register:reg,done};
 $('app').innerHTML=S.role==='admin'?admin():P[S.tab]();
 $('nav').innerHTML=S.role==='admin'?'':[['home','Home'],['sessions','Sessions'],['events','Events'],['plan','Plan'],['alerts','Alerts'],['profile','Profile']].map(t=>`<button class="${S.tab===t[0]?'on':''}" onclick="tab('${t[0]}')">${t[1]}</button>`).join('');
 window.scrollTo(0,S.tab===S._t?y:0);S._t=S.tab;tick()}
const map=a=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(a);
const FL=[['hometown','Home town'],['email','Email'],['emergency','Emergency contact'],['age','Age'],['medical','Medical information'],['allergies','Allergies'],['position','Position'],['skill','Skill level'],['media','Media consent']];

 if(!V('dp'))return 'Please accept the data protection notice'}

function tourAdmin(){return `<h2>Takeover 3x3</h2><div class="card"><h3 class="big">Create a tournament</h3>${['Title|tt','Venue|tv','Address|ta','Price, team of 3 (£)|tp3|number','Price, team of 4 (£)|tp4|number','Price, team of 5 (£)|tp5|number','Age categories, separated by commas|tc'].map(x=>{const a=x.split('|');return `<label class="mute" for="${a[1]}">${a[0]}</label><input id="${a[1]}" type="${a[2]||'text'}">`}).join('')}<label class="mute" for="td">Date and time</label><input id="td" type="datetime-local"><p class="mute" style="margin:4px 0">Details to collect from each player (full name is always collected)</p>${FL.map(x=>`<label style="display:flex;gap:8px;margin:4px 0"><input type="checkbox" style="width:auto;margin:0" id="tf_${x[0]}" checked>${x[1]}</label>`).join('')}<button class="btn" style="margin-top:10px" onclick="addTour()">Publish tournament</button></div><h2>Registrations</h2>`+(S.regs.length?`<div class="card tbl"><table><tr><th>Team</th><th>Category</th><th>Players</th><th>Paid</th><th></th></tr>${S.regs.map(r=>`<tr><td>${r.team}</td><td>${r.cat}</td><td>${r.n}</td><td><span class="pill ok">£${r.total.toFixed(2)}</span></td><td><button class="btn ghost" style="min-height:34px;padding:4px 10px" onclick="viewReg(${r.id})">View</button></td></tr>`).join('')}</table></div>`:`<div class="card mute">No teams yet. Register one from the Events tab as a player.</div>`)}
